[workspace]
name = "h-anonypy"
version = "0.5.0"
description = "Utilities for video and DICOM anonymization workflows."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
opencv = "*"
openpyxl = "*"
pandas = "*"
psycopg2 = "*"
pyyaml = "*"
pydicom = ">=3,<4"
sqlalchemy = "*"
ffmpeg = "*"

[feature.dev.dependencies]
black = "*"
pre-commit = "*"
pytest = "*"
ruff = "*"

[feature.dev.tasks]
test = "pytest -q tests"
check = "pre-commit run --all-files"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
